[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "Email-MCP-zack"
version = "0.1.0"
description = "Local stdio MCP server for IMAP, POP3 and SMTP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
email-mcp = "email_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1.2,<2", "twine>=6,<8"]

[project.urls]
Homepage = "https://github.com/zack-zzq/Email-MCP"
Repository = "https://github.com/zack-zzq/Email-MCP"
Issues = "https://github.com/zack-zzq/Email-MCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/email_mcp"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "examples", "README.md", ".env.example", "pyproject.toml", "uv.lock", "LICENSE", ".github/workflows/publish.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
