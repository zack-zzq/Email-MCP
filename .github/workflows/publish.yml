name: Publish to PyPI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current version to PyPI (main branch only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Check code and run tests
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync pytest -q

      - name: Validate package identity and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import runpy
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if project["name"] != "Email-MCP-zack":
              raise SystemExit("The distribution name must be Email-MCP-zack")
          version = project["version"]
          runtime_version = runpy.run_path("src/email_mcp/__init__.py")["__version__"]
          if version != runtime_version:
              raise SystemExit("pyproject.toml and email_mcp.__version__ must match")
          tag = os.environ.get("RELEASE_TAG", "")
          if not tag and os.environ.get("GITHUB_REF_TYPE") == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
          if tag and tag != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}; received {tag}")
          print(f"Validated {project['name']} {version}")
          PY

      - name: Build wheel and source distribution
        run: |
          uv build
          uv run --no-sync twine check --strict dist/*

      - name: Verify the installed wheel through MCP
        run: |
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          uv run --no-sync pytest tests/test_mcp.py -q

      - name: Store tested distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Email-MCP-zack to PyPI
    needs: build
    if: >-
      github.repository == 'zack-zzq/Email-MCP' &&
      (github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish &&
      github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/Email-MCP-zack
    permissions:
      id-token: write
    concurrency:
      group: pypi-production
      cancel-in-progress: false
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

      - name: Report package and MCP command
        run: |
          {
            echo 'Published [Email-MCP-zack](https://pypi.org/p/Email-MCP-zack).'
            echo ''
            echo 'MCP command: `uvx --from Email-MCP-zack email-mcp`'
          } >> "$GITHUB_STEP_SUMMARY"
